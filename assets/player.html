<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { margin:0; overflow:hidden; background:transparent; }
    video {
      position:fixed;
      top:0; left:0;
      width:100vw; height:100vh;
      object-fit:cover;
      /* 避免 macOS 黑屏问题 */
      filter: blur(0);
    }
  </style>
</head>
<body>
  <video id="bg" autoplay loop {{MUTED}} playsinline webkit-playsinline>
    <source src="{{VIDEO_PATH}}" type="video/mp4">
    <source src="{{VIDEO_PATH}}" type="video/quicktime">
  </video>

  <script>
    const video = document.getElementById('bg');
    let pauseTime = 0;

    // 页面可见性变化处理（锁屏/盒盖时自动暂停，解锁/开盖后自动恢复）
    // 若用户通过快捷键手动暂停，则跳过自动恢复，直到再次快捷键恢复
    // WKWebView 休眠唤醒后 video 解码器会重置，需显式恢复播放位置
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        pauseTime = video.currentTime;
        video.pause();
      } else if (!window.userPaused) {
        // 正常恢复播放
        if (pauseTime > 0) video.currentTime = pauseTime;
        video.play().catch(() => {});
      } else {
        // 手动暂停状态：不恢复播放，但恢复视频帧位置（防止跳到第一帧）
        if (pauseTime > 0) video.currentTime = pauseTime;
      }
    });

    // 接收 Objective-C 指令
    window.externalPause = () => { pauseTime = video.currentTime; video.pause(); };
    window.externalResume = () => { if (!window.userPaused) { if (pauseTime > 0) video.currentTime = pauseTime; video.play().catch(() => {}); } };
    window.isPaused = () => video.paused;
    window.togglePlayback = () => {
        window.userPaused = !window.userPaused;
        if (video.paused) {
          if (pauseTime > 0) video.currentTime = pauseTime;
          video.play().catch(() => {});
        } else {
          pauseTime = video.currentTime;
          video.pause();
        }
    };
  </script>
</body>
</html>
