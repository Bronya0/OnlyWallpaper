<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { margin:0; overflow:hidden; background:transparent; }
    video {
      position:fixed;
      top:0; left:0;
      width:100vw; height:100vh;
      object-fit:cover;
      /* 避免 macOS 黑屏问题 */
      filter: blur(0);
    }
  </style>
</head>
<body>
  <video id="bg" loop {{MUTED}} playsinline webkit-playsinline>
    <source src="{{VIDEO_PATH}}" type="video/mp4">
    <source src="{{VIDEO_PATH}}" type="video/quicktime">
  </video>

  <script>
    const video = document.getElementById('bg');
    let pauseTime = 0;

    window.userPaused = false;
    // 原生状态尚未同步前保持暂停，防止启动/切歌时短暂漏播声音。
    window.autoPaused = true;

    function syncPlayback() {
      if (document.hidden || window.userPaused || window.autoPaused) {
        // 重复暂停不能覆盖保存的位置；唤醒时解码器可能已重置到 0。
        if (!video.paused) pauseTime = video.currentTime;
        video.pause();
        if (!document.hidden && pauseTime > 0) video.currentTime = pauseTime;
        return;
      }
      // 已在播放时不重复 seek，避免焦点/唤醒通知让视频跳回旧位置。
      if (!video.paused) return;
      if (pauseTime > 0) video.currentTime = pauseTime;
      video.play().catch(() => {});
    }

    // 可见性、手动暂停和自动暂停必须同时满足才允许恢复。
    document.addEventListener('visibilitychange', syncPlayback);
    window.setPlaybackState = (userPaused, autoPaused) => {
      window.userPaused = userPaused;
      window.autoPaused = autoPaused;
      syncPlayback();
    };
    window.isPaused = () => video.paused;
    // 兼容旧调用方；手动状态统一由 Objective-C 快捷键处理。
    window.togglePlayback = () => {};
  </script>
</body>
</html>
